[package]
name = "mmo-api"
version = "0.1.0"
edition = "2021"
authors = ["MMO Team"]
description = "Production-ready Rust API server with actix-web and MongoDB"

[dependencies]
# Web Framework
actix-web = "4.9"
actix-rt = "2.10"
actix-cors = "0.7"
actix-web-grants = "4"

# OpenAPI / Swagger
utoipa = { version = "5.4.0 ", features = ["actix_extras", "macros"] }
utoipa-swagger-ui = { version = "9", features = ["actix-web"] }

# Async Runtime
tokio = { version = "1.42", features = ["full"] }
futures = "0.3"
futures-util = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database - MongoDB
mongodb = "3.1"
bson = { version = "2.13", features = ["chrono-0_4"] }

# Database - Redis (for caching & sessions)
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Authentication & Security
jsonwebtoken = "9.3"
bcrypt = "0.15"
argon2 = "0.5.0"

# Validation
validator = { version = "0.18", features = ["derive"] }

# Date & Time
chrono = { version = "0.4", features = ["serde"] }

# Environment & Configuration
dotenv = "0.15"
config = "0.14"

# Error Handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-actix-web = "0.7"

# UUID/ULID Generation
uuid = { version = "1.11", features = ["v4", "serde"] }
ulid = "1.1"

# Rate Limiting
actix-governor = "0.6"

# Background Jobs (Cron)
tokio-cron-scheduler = "0.13"

# HTTP Client (for external APIs)
reqwest = { version = "0.12", features = ["json"] }

[[bin]]
name = "seed_permissions"
path = "migrations/src/seed_permissions.rs"

[[bin]]
name = "create_super_admin"
path = "scripts/create_super_admin.rs"

[dev-dependencies]
# Testing
mockall = "0.13"
fake = "2.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
