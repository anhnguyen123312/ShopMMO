# ============================================================================
# Docker Compose for MMO API
# ============================================================================
# 
# Usage:
#   docker-compose up -d          # Start all services
#   docker-compose down           # Stop all services
#   docker-compose logs -f app    # View app logs
#   docker-compose build          # Rebuild app image
#
# ============================================================================

services:
  # ==========================================================================
  # MongoDB Database
  # ==========================================================================
  mongodb:
    image: mongo:7.0
    container_name: mmo-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: mmo_admin
      MONGO_INITDB_ROOT_PASSWORD: mmo_secret_password
      MONGO_INITDB_DATABASE: mmo_db
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    ports:
      - "27017:27017"
    networks:
      - mmo-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================================================
  # Redis Cache
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: mmo-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass mmo_redis_password
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - mmo-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "mmo_redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# ==========================================================================
# Volumes
# ==========================================================================
volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local

# ==========================================================================
# Networks
# ==========================================================================
networks:
  mmo-network:
    driver: bridge
